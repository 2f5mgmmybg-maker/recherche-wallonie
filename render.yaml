databases:
  - name: wallonie-db
    plan: basic-256mb
    databaseName: wallonie
    user: wallonie

services:
  - type: worker
    name: recherche-wallonie
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: wallonie-db
          property: connectionString
      - key: TELEGRAM_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
